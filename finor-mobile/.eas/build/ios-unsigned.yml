build:
  name: finor - IPA para assinatura pessoal posterior
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/resolve_build_config
    - eas/prebuild
    - run:
        name: Instalar dependências nativas iOS
        working_directory: ./ios
        command: pod install
    - run:
        name: Compilar e empacotar IPA sem assinatura
        command: node scripts/build-ipa.cjs --unsigned --prepared
    - eas/upload_artifact:
        name: Enviar finor-unsigned.ipa para download e assinatura pessoal
        inputs:
          type: application-archive
          path: build/ios/*/export/finor-unsigned.ipa
