services:
  api:
    build: ./finor-api
    environment:
      SPRING_PROFILES_ACTIVE: firestore,prod
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID}
      FIREBASE_DATABASE_ID: ${FIREBASE_DATABASE_ID:-(default)}
      GOOGLE_APPLICATION_CREDENTIALS: /run/finor/firebase-service-account.json
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      MAIL_FROM: ${MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-false}
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Defina o caminho da conta de serviço}
        target: /run/finor/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8080:8080"]

